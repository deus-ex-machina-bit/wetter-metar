name: Sonne Abfrage

on:
  schedule:
    - cron: '20 * * * *'   # jede Stunde um :20
  workflow_dispatch:

jobs:
  sonne:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Abhängigkeiten installieren
        run: pip install requests xarray netCDF4 pyproj h5netcdf h5py
      
      - name: Sonne abfragen
        run: python sonne_holen.py

      - name: Open-Meteo Sonnenscheindauer holen
        run: python sonne_openmeteo.py
      
      - name: Änderungen committen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sonne_werte.csv
          git diff --staged --quiet || git commit -m "Sonne Update"
          git push
