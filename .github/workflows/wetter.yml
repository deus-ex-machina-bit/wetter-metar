name: Wetterdaten aktualisieren

on:
  schedule:
    - cron: '0 * * * *'   # jede volle Stunde
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          pip install xarray netCDF4

      - name: RADOLAN für Aurich holen
        run: python radolan_aurich.py

      - name: Änderungen committen
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add radolan_aurich.csv || true
          git diff --staged --quiet || git commit -m "RADOLAN Aurich aktualisiert" || true
          git push || true
